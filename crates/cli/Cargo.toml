[package]
name = "orphusbot-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The orphusbot command: sign in, see what bots are doing, answer approvals, send messages"

[[bin]]
name = "orphusbot"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
futures-util = "0.3.34"
orphusbot-proto = { version = "0.1.0", path = "../proto" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "process", "time"] }
