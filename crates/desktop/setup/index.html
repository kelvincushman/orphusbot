<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>OrphusBot</title>
<style>
  :root { --bg: #fff; --fg: #141416; --muted: #6b6b73; --line: #e2e2e6; --accent: #2f6bff; --accent-fg: #fff; --bad: #c0172d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0e10; --fg: #ececf1; --muted: #9a9aa5; --line: #2a2a30; --accent: #6b95ff; --accent-fg: #0e0e10; --bad: #ff6b81; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  form { width: min(22rem, 100% - 2rem); display: flex; flex-direction: column; gap: .7rem; }
  h1 { margin: 0; font-size: 1.4rem; }
  p { margin: 0; color: var(--muted); }
  input, button { font: inherit; padding: .55rem .8rem; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); cursor: pointer; }
  #err { color: var(--bad); min-height: 1.5em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<form id="f">
  <h1>OrphusBot</h1>
  <p>Your OrphusBot server's address, for example https://bots.example.com</p>
  <input id="url" type="url" aria-label="Server address" placeholder="https://bots.example.com" required autofocus>
  <button>Connect</button>
  <p id="err" role="alert"></p>
</form>
<script src="setup.js"></script>
</body>
</html>
