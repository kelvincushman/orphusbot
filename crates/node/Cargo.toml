[package]
name = "orphusbot-node"
version = "0.1.0"
description = "OrphusBot node daemon: runs Orphus engines on one of your machines"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
hex = "0.4.3"
openssl = "0.10.81"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
orphusbot-proto = { version = "0.1.0", path = "../proto" }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
