[package]
name = "orphusbot-server"
version = "0.1.0"
description = "OrphusBot server: tasks, runs, the event log and the client API"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
croner = "4.0.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
openssl = "0.10.81"
orphusbot-device = { version = "0.1.0", path = "../device" }
orphusbot-proto = { version = "0.1.0", path = "../proto" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json", "chrono"] }
subtle = "2.6.1"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webauthn-rs = "0.5.5"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
