<!doctype html>
<!-- Placeholder UI: plain HTML and EventSource. The Leptos UI replaces it in M1.4 (DECISIONS D-013). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrphusBot</title>
<style>
  :root { --bg: #fff; --fg: #111; --muted: #666; --line: #ddd; --you: #eef3ff; --bot: #f4f4f4; --bad: #b00020; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --fg: #eee; --muted: #999; --line: #333; --you: #14213d; --bot: #1a1a1a; --bad: #ff6b81; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 46rem; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; min-height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  #account { display: flex; gap: .5rem; }
  #account button, #signin p { font-size: .875rem; }
  #signin { display: flex; flex-direction: column; gap: .75rem; padding: 1rem 0; }
  #signin p { margin: 0; color: var(--muted); }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  #status { color: var(--muted); font-size: .875rem; }
  #log { flex: 1; display: flex; flex-direction: column; gap: .5rem; padding: .5rem 0; }
  .msg { padding: .5rem .75rem; border-radius: .5rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { background: var(--you); align-self: flex-end; max-width: 85%; }
  .assistant { background: var(--bot); max-width: 100%; }
  .error { color: var(--bad); font-size: .875rem; }
  form { display: flex; gap: .5rem; border-top: 1px solid var(--line); padding-top: .75rem; }
  textarea, input { flex: 1; font: inherit; padding: .5rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: .5rem; }
  button { font: inherit; padding: .5rem 1rem; border-radius: .5rem; border: 1px solid var(--line); background: var(--fg); color: var(--bg); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid #4c8dff; outline-offset: 2px; }
  [hidden] { display: none !important; }
  .card { border: 1px solid var(--line); border-radius: .5rem; padding: .75rem; display: flex; flex-direction: column; gap: .5rem; }
  .card h2 { font-size: 1rem; margin: 0; }
  .card pre { margin: 0; padding: .5rem; background: var(--bot); border-radius: .25rem; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .875rem; max-height: 16rem; overflow: auto; }
  .card .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  .card .warn { color: var(--bad); margin: 0; }
  .card .outcome { color: var(--muted); font-size: .875rem; margin: 0; }
  .card.closed button, .card.closed textarea { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>OrphusBot</h1>
    <span id="status" role="status">Connecting…</span>
    <span id="account" hidden>
      <button id="pk-show" type="button">Add a passkey</button>
      <button id="logout" type="button">Sign out</button>
    </span>
  </header>

  <section id="signin" hidden>
    <button id="pk-signin" type="button" hidden>Sign in with a passkey</button>
    <form id="setup" method="post" action="/auth/setup" hidden>
      <input name="token" type="password" aria-label="Setup token" placeholder="Setup token" autocomplete="off" required>
      <button>Continue</button>
    </form>
    <p id="setup-help" hidden>First run: enter the setup token from the server's environment, then add a passkey.</p>
  </section>

  <section id="pk-card" class="card" hidden aria-label="Add a passkey">
    <h2>Add a passkey</h2>
    <p id="pk-why" class="warn" hidden>You are signed in with the setup token for one hour. Add a passkey to keep access.</p>
    <div class="row">
      <input id="pk-name" value="This device" maxlength="60" aria-label="Passkey name">
      <button id="pk-add" type="button">Add passkey</button>
    </div>
  </section>

  <div id="chat" hidden>
    <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
    <form id="send">
      <textarea id="text" rows="2" aria-label="Message" placeholder="Message the bot (Enter to send, Shift+Enter for a new line)" required></textarea>
      <button id="go">Send</button>
      <button id="stop" type="button" hidden>Stop</button>
    </form>
  </div>
  <p id="err" class="error" role="alert"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
let pending = null; // the assistant bubble that is still streaming

function bubble(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text; // textContent, never innerHTML: bot output is untrusted
  log.append(div);
  div.scrollIntoView({ block: "end" });
  return div;
}

// run: null when idle, otherwise "queued" or "running"
let node = { online: false, name: null }, run = null, resumed = false;
function setStatus() {
  const where = node.online ? "Node " + node.name + " online" : "No node connected";
  const what = run === "queued" ? " · waiting for a node" : run === "running" ? (resumed ? " · resuming after an interruption…" : " · working…") : "";
  $("status").textContent = where + what;
  $("stop").hidden = run === null;
}

const cards = new Map(); // dialog id -> card element

function button(label, onClick) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label; b.addEventListener("click", onClick);
  return b;
}

async function answer(body) {
  const r = await fetch("/api/dialogs/answer", {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  }).catch(() => null);
  if (!r || !r.ok) $("err").textContent = r ? await r.text() : "Could not reach the server";
}

// Approval or question card. All text goes in with textContent: it comes from the bot.
function card(d) {
  const el = document.createElement("section");
  el.className = "card"; el.setAttribute("aria-label", "Needs your answer");
  const h = document.createElement("h2");
  const row = document.createElement("div"); row.className = "row";
  const id = d.id;
  if (d.kind.kind === "approval") {
    h.textContent = "Allow the bot to use " + d.kind.tool + "?";
    el.append(h);
    if (d.kind.uncertain) {
      const w = document.createElement("p"); w.className = "warn";
      w.textContent = "An interrupted attempt may already have run this. Check before allowing it again.";
      el.append(w);
    }
    const pre = document.createElement("pre"); pre.textContent = JSON.stringify(d.kind.input, null, 2);
    el.append(pre);
    row.append(
      button("Allow once", () => answer({ id, decision: "allow" })),
      button("Always allow " + d.kind.tool, () => answer({ id, decision: "always" })),
      button("Deny", () => answer({ id, decision: "deny" })),
    );
  } else {
    const q = d.kind;
    h.textContent = q.title || "The bot has a question";
    el.append(h);
    if (q.message) { const p = document.createElement("p"); p.textContent = q.message; el.append(p); }
    if (q.method === "select") q.options.forEach((o) => row.append(button(o, () => answer({ id, value: o }))));
    else if (q.method === "confirm") row.append(button("Yes", () => answer({ id, confirmed: true })), button("No", () => answer({ id, confirmed: false })));
    else {
      const t = document.createElement("textarea"); t.rows = 3; t.setAttribute("aria-label", "Your answer");
      el.append(t);
      row.append(button("Send answer", () => answer({ id, value: t.value })));
    }
    row.append(button("Dismiss", () => answer({ id })));
  }
  const outcome = document.createElement("p"); outcome.className = "outcome";
  el.append(row, outcome);
  log.append(el); el.scrollIntoView({ block: "end" });
  cards.set(id, el);
}

function handle(ev) {
  switch (ev.type) {
    case "dialog_opened": card(ev.dialog); break;
    case "dialog_closed": {
      const el = cards.get(ev.id);
      if (el) { el.classList.add("closed"); el.querySelector(".outcome").textContent = ev.outcome; cards.delete(ev.id); }
      break;
    }
    case "message":
      if (ev.role === "assistant" && pending) { pending.textContent = ev.text; pending = null; }
      else bubble(ev.role, ev.text);
      break;
    case "delta":
      pending ??= bubble("assistant", "");
      pending.textContent += ev.text;
      pending.scrollIntoView({ block: "end" });
      break;
    case "run_queued": run = "queued"; pending = null; break;
    case "run_started": run = "running"; resumed = ev.resumed; break;
    case "run_ended":
      run = null; pending = null;
      if (ev.outcome === "failed") bubble("error", "The run failed: " + (ev.error || "unknown error"));
      if (ev.outcome === "cancelled") bubble("error", "Stopped.");
      break;
    case "node_status": node = { online: ev.online, name: ev.node }; break;
  }
  setStatus();
}

function connect() {
  const es = new EventSource("/api/events");
  es.onmessage = (m) => handle(JSON.parse(m.data));
  es.onopen = () => { $("chat").hidden = false; };
  es.onerror = async () => {
    // EventSource retries by itself; only stop and ask to sign in on a 401.
    const r = await fetch("/api/events?after=999999999", { method: "HEAD" }).catch(() => null);
    if (r && r.status === 401) { es.close(); boot(); }
    else $("status").textContent = "Reconnecting…";
  };
}

// Sign-in. Passkeys use the browser's own JSON helpers, so no base64 code here.
const postJSON = (url, body) => fetch(url, {
  method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
}).catch(() => null);
const say = (text) => { $("err").textContent = text; };
const failed = async (r) => say(r ? await r.text() : "Could not reach the server");
const passkeysWork = () => !!window.PublicKeyCredential?.parseCreationOptionsFromJSON;

async function boot() {
  const r = await fetch("/auth/state").catch(() => null);
  if (!r || !r.ok) return failed(r);
  const s = await r.json();
  $("signin").hidden = s.signed_in;
  $("account").hidden = !s.signed_in;
  $("chat").hidden = true;
  if (!s.signed_in) {
    $("status").textContent = "Signed out";
    $("setup").hidden = $("setup-help").hidden = !s.setup_open;
    $("pk-signin").hidden = s.setup_open;
    return;
  }
  $("pk-card").hidden = $("pk-why").hidden = !s.needs_passkey;
  connect();
}

$("pk-signin").addEventListener("click", async () => {
  say("");
  if (!passkeysWork()) return say("This browser is too old for passkeys.");
  const r = await postJSON("/auth/login/start", {});
  if (!r || !r.ok) return failed(r);
  const { id, options } = await r.json();
  let credential;
  try {
    credential = await navigator.credentials.get({ publicKey: PublicKeyCredential.parseRequestOptionsFromJSON(options.publicKey) });
  } catch (e) { return say("Passkey sign-in didn't finish: " + e.message); }
  const f = await postJSON("/auth/login/finish", { id, credential: credential.toJSON() });
  if (!f || !f.ok) return failed(f);
  boot();
});

$("pk-show").addEventListener("click", () => { $("pk-card").hidden = false; $("pk-name").focus(); });
$("pk-add").addEventListener("click", async () => {
  say("");
  if (!passkeysWork()) return say("This browser is too old for passkeys.");
  const r = await postJSON("/api/passkeys/start", {});
  if (!r || !r.ok) return failed(r);
  const { id, options } = await r.json();
  let credential;
  try {
    credential = await navigator.credentials.create({ publicKey: PublicKeyCredential.parseCreationOptionsFromJSON(options.publicKey) });
  } catch (e) { return say("The passkey wasn't added: " + e.message); }
  const f = await postJSON("/api/passkeys/finish", { id, name: $("pk-name").value, credential: credential.toJSON() });
  if (!f || !f.ok) return failed(f);
  $("pk-card").hidden = true;
  say("Passkey added.");
});

$("logout").addEventListener("click", async () => {
  const r = await postJSON("/api/logout", {});
  if (r && r.ok) location.reload(); else failed(r);
});

$("send").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("go").disabled = true; $("err").textContent = "";
  const r = await fetch("/api/messages", {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }),
  }).catch(() => null);
  $("go").disabled = false;
  if (r && r.ok) $("text").value = "";
  else $("err").textContent = r ? await r.text() : "Could not reach the server";
});
$("stop").addEventListener("click", async () => {
  const r = await fetch("/api/runs/cancel", { method: "POST" }).catch(() => null);
  if (!r || !r.ok) $("err").textContent = r ? await r.text() : "Could not reach the server";
});
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").requestSubmit(); }
});

boot();
</script>
</body>
</html>
