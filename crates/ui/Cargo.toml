[package]
name = "orphusbot-ui"
version = "0.1.0"
description = "OrphusBot web UI (Leptos, client-side), also loaded by the desktop and Android apps"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Browser-only: on other targets the crate builds as an empty binary, so native
# `cargo build/test --workspace` doesn't compile Leptos. Build it with Trunk.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["csr"] }
orphusbot-proto = { version = "0.1.0", path = "../proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Clipboard", "EventSource", "HtmlElement", "KeyboardEvent", "MessageEvent", "Navigator", "Window"] }
