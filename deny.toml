# cargo-deny: licences, security advisories, duplicate and unknown sources.
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive licences only (CONTRIBUTING.md, "Dependencies").
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
