# cargo-deny: licences, security advisories, duplicate and unknown sources.
[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # `paste` is finished and unmaintained, not vulnerable; it comes in through Leptos
  # (either_of). Drop this when Leptos moves off it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro pulled in by leptos; no vulnerability" },
  # `proc-macro-error` is unmaintained, not vulnerable; it comes in through the GTK bindings Tauri uses on Linux.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained proc-macro pulled in by gtk-rs via tauri; no vulnerability" },
  # zbus's name/variant crates were marked unmaintained on 2026-10-20, not vulnerable; they come in
  # through tauri-plugin-opener in the old Tauri desktop app, which the Flutter app replaces (D-033).
  { id = "RUSTSEC-2026-0370", reason = "unmaintained, via tauri-plugin-opener in the legacy Tauri app; no vulnerability" },
  { id = "RUSTSEC-2026-0371", reason = "unmaintained, via tauri-plugin-opener in the legacy Tauri app; no vulnerability" },
  { id = "RUSTSEC-2026-0372", reason = "unmaintained, via tauri-plugin-opener in the legacy Tauri app; no vulnerability" },
]

[licenses]
# Permissive licences only (CONTRIBUTING.md, "Dependencies").
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.9
# The passkey library (webauthn-rs, by the Kanidm project) is MPL-2.0: file-level
# copyleft, fine for an MIT project that uses it unmodified (DECISIONS D-016).
# Listed by name so no other MPL crate slips in.
exceptions = [
  { allow = ["MPL-2.0"], crate = "webauthn-rs" },
  { allow = ["MPL-2.0"], crate = "webauthn-rs-core" },
  { allow = ["MPL-2.0"], crate = "webauthn-rs-proto" },
  { allow = ["MPL-2.0"], crate = "webauthn-attestation-ca" },
  { allow = ["MPL-2.0"], crate = "base64urlsafedata" },
  { allow = ["MPL-2.0"], crate = "webauthn-authenticator-rs" },
  # Tauri (desktop app): Servo's CSS parsing crates and `dirs`'s option-ext, also unmodified MPL-2.0.
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  { allow = ["MPL-2.0"], crate = "selectors" },
  { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
