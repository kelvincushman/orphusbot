<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$name</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0f1218 radial-gradient(circle at 50% 35%, ${colour}55, ${colour}11 70%);
    color: #f2f4f8; font-family: "DejaVu Sans", sans-serif; text-align: center;
  }
  #clock { font-size: 96px; font-weight: bold; }
  #date { font-size: 22px; color: #c3c9d6; }
  h1 { margin: 48px 0 8px; font-size: 40px; border-bottom: 4px solid $colour; padding-bottom: 8px; }
  p { margin: 0; max-width: 40em; padding: 0 24px; font-size: 20px; color: #c3c9d6; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="clock"></div>
<div id="date"></div>
<h1>$name</h1>
<p>$remit</p>
<script>
  function tick() {
    var now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    document.getElementById("date").textContent =
      now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
