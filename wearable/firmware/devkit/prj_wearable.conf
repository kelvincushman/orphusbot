#
# Wearable Kconfig delta — layered on top of prj_xiao_ble_sense_devkitv2-adafruit.conf.
# Build with:
#   west build -b xiao_ble_sense -d build_wearable -- \
#     -DCONF_FILE="prj_xiao_ble_sense_devkitv2-adafruit.conf;prj_wearable.conf" \
#     -DDTC_OVERLAY_FILE="overlay/xiao_ble_sense_devkitv2-adafruit.overlay;overlay/wearable-peripherals.overlay"

# --- NeoPixel (WS2812 via SPIM3 on A3) ---
# SPIM3 (0x4002F000) is the standalone SPI instance with NO TWIM sibling.
# SPIM1 shares peripheral instance 1 (0x40004000) with the board's i2c1/TWIM1
# ("Cannot be used together with spi1" — xiao_ble_common.dtsi), so enabling &spi1
# for the WS2812 collided two drivers on one block/IRQ and hard-faulted. SPIM3
# avoids that, and being pure EasyDMA (no irq_lock) it coexists with BLE — unlike
# the GPIO bit-bang driver, whose irq_lock starved the radio and killed BLE.
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# --- PWM (optional second haptic motor on A1) ---
CONFIG_PWM=y
CONFIG_PWM_NRFX=y

# --- Input subsystem (for IoT Button on A2) ---
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# --- Speaker is disabled in this build (no 5769 BFF) ---
# Overlay disables &i2s0, so CONFIG_I2S_NRFX (which requires an I2S node
# in DT) must be off. We also disable CONFIG_I2S since no I2S hardware
# remains. speaker.c::play_haptic_milli is GPIO-only, so it still builds.
CONFIG_I2S=n
CONFIG_I2S_NRFX=n

# --- Override adafruit conf's CONFIG_PRINTK=n ---
# Some logging/console dep force-selects PRINTK; aligning the requested
# value avoids a fatal Kconfig warning.
CONFIG_PRINTK=y

# --- System power management (required for sys_poweroff) ---
CONFIG_POWEROFF=y

# --- Device Information Service firmware revision ---
# Upstream DK2 v2.0.10 sets CONFIG_BT_DIS_FW_REV_STR="2.0.10"; we override it
# here so nRF Connect / any other BLE inspector can tell at a glance that a
# paired device is running the Wearable fork. Version follows the Wearable
# semver (see src/index.ts VERSION constant).
CONFIG_BT_DIS_FW_REV_STR="wearable-0.1.0+dk2-2.0.10"
CONFIG_BT_DIS_MODEL_NUMBER_STR="wearable"
CONFIG_BT_DIS_MANUF_NAME_STR="Kelvin Lee"

# --- BLE advertised device name (what shows in LightBlue / the app scan) ---
# Dropping the "Wearable"/"KelvinLee DevKit 2" naming; the wearable now advertises as "wearable".
CONFIG_BT_DEVICE_NAME="wearable"

# Radio TX power. BT_CTLR_TX_PWR_ANTENNA is SoftDevice-Controller only
# (depends on !BT_LL_SW_SPLIT). The open link layer selects the level from
# this choice instead; +8 dBm is available because the nRF52840 sets
# HAS_HW_NRF_RADIO_TX_PWR_HIGH. Same radiated power as the NCS build.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# No speaker on this hardware (I2S is disabled by wearable-peripherals.overlay).
# Left =y, speaker_init() gets NULL from device_get_binding("I2S_0") and main()
# returns at that point -- before transport_start(), codec and mic -- so the
# device enumerates USB and does nothing else. prj_wearable_bare_xiao.conf,
# _phase2 and _phase3_sd already set this; prj_wearable.conf did not, so the
# documented devkitv2-adafruit build produced a non-functional image.
