#
# Bench-testing overlay — Xiao nRF52840 Sense with NO BFFs soldered yet.
# Layered AFTER prj_wearable.conf. Remove from CONF_FILE when BFFs are soldered.
#
# Build with:
#   -DCONF_FILE="prj_xiao_ble_sense_devkitv2-adafruit.conf;prj_wearable.conf;prj_wearable_bare_xiao.conf"

# No MicroSD BFF → mount_sd_card() would hard-fail main().
CONFIG_KELVINLEE_ENABLE_OFFLINE_STORAGE=n

# No battery BFF → battery_init() would hard-fail main().
CONFIG_KELVINLEE_ENABLE_BATTERY=n

# No speaker (I2S disabled in prj_wearable.conf) → speaker_init() calls
# device_get_binding("I2S_0"), gets NULL, then dereferences name → crash.

# Bench board has no BFFs — disable all peripherals that could hang on init.
# Symptom: boot LED sequence completes but no further LED activity → main is
# wedged somewhere between boot_led_sequence and set_led_blue(true).
CONFIG_KELVINLEE_ENABLE_BUTTON=n
CONFIG_KELVINLEE_ENABLE_HAPTIC=n
CONFIG_KELVINLEE_ENABLE_USB=n

# NeoPixel + IoT button + vibration PWM disabled at the DT level via
# overlay/wearable-bare-xiao.overlay (layered last). Keeping LED_STRIP/
# WS2812_STRIP_SPI enabled in the driver stack so neopixel.c compiles,
# but the strip node is status="disabled" so HAS_STRIP is 0 at file scope
# and neopixel_init takes the stub path — no blocking SPI1 write on a
# dead MOSI.
