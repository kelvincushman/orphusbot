#
# !! DO NOT FLASH THIS AS-IS !!
#
# Observed twice on hardware: an image built with this config hangs during boot
# and the device never finishes enumerating over USB. Cause: CONFIG_UART_CONSOLE
# routes the console to board_cdc_acm_uart, and main.c calls LOG_PRINTK()
# throughout its init sequence. cdc_acm poll-out blocks until the ring buffer
# drains, which requires a host to have opened the port -- during early boot
# nothing has, so it spins forever. Recovery is double-tap reset and flash a
# release image; the bootloader ROM is unaffected.
#
# To make this usable, the console must not be written to before a host is
# attached: gate early output on uart_line_ctrl_get(dev, UART_LINE_CTRL_DTR),
# or move the console off CDC entirely (RTT with a debug probe, or a physical
# UART on D6/D7). Until then this file is kept for reference only.
#

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=4

# Deferred, not immediate. Anything logged before the host opens the CDC port
# would be lost in immediate mode; deferred queues it and flushes on connect,
# so the early init sequence survives. A large buffer because the whole boot
# chain lands before anyone is listening.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=2000

CONFIG_PRINTK=y
CONFIG_THREAD_NAME=y

# Bluetooth module logging follows CONFIG_LOG_DEFAULT_LEVEL. CONFIG_BT_DEBUG_LOG
# was removed in Zephyr 4.x in favour of per-module levels; do not re-add it.
