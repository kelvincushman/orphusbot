#
# Phase 2 bench config — IoT Button + NeoPixel BFF attached (A2 button,
# A3 NeoPixel), but NO MicroSD / battery / speaker BFF yet.
#
# Use INSTEAD OF prj_wearable_bare_xiao.conf, layered AFTER prj_wearable.conf.
# Pair with overlays devkitv2-adafruit + wearable-peripherals (and NOT the
# wearable-bare-xiao overlay), so &led_strip / &iot_button / &vibration_pwm
# stay enabled at the devicetree level.
#
# Build:
#   west build -b xiao_ble_sense -d build_phase2 --no-sysbuild -p -- \
#     -DCONF_FILE="prj_xiao_ble_sense_devkitv2-adafruit.conf;prj_wearable.conf;prj_wearable_phase2.conf" \
#     -DDTC_OVERLAY_FILE="overlay/xiao_ble_sense_devkitv2-adafruit.overlay;overlay/wearable-peripherals.overlay"

# --- Enabled for Phase 2 ---
CONFIG_KELVINLEE_ENABLE_BUTTON=y           # A2 IoT-button FSM (tap/double/triple/hold) + D5 button
CONFIG_KELVINLEE_ENABLE_HAPTIC=y           # haptic cues from button gestures (init is non-fatal if no motor)

# --- Still disabled: those BFFs are not attached yet ---
CONFIG_KELVINLEE_ENABLE_OFFLINE_STORAGE=n  # no MicroSD BFF until Phase 4
CONFIG_KELVINLEE_ENABLE_BATTERY=n          # no battery BFF (USB-powered bench)

# USB power-supply check OFF: init_usb() does usb_disable()+usb_enable(), which
# blocks/hangs main() after the boot LED sequence when the USB-CDC console is up
# (logs go to RTT, so CONFIG_UART_CONSOLE is unset -> the disable/enable path runs).
# Phase 1 (USB off) booted fully and still enumerated as ZEPHYR CDC, so off is safe.
CONFIG_KELVINLEE_ENABLE_USB=n
