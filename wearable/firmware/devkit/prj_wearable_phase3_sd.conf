#
# Phase 3 bench config — IoT Button + NeoPixel BFF attached (A2 button,
# A3 NeoPixel) AND MicroSD BFF attached on SPI2 (A0 CS, D8/D9/D10 SPI).
#
# Use INSTEAD OF prj_wearable_phase2.conf, layered AFTER prj_wearable.conf.
# Pair with overlays devkitv2-adafruit + wearable-peripherals. The devkitv2
# overlay owns the SD BFF SPI2 node; wearable-peripherals owns button/NeoPixel.
#
# Build:
#   west build -b xiao_ble_sense -d build_phase3_sd --no-sysbuild -p -- \
#     -DCONF_FILE="prj_xiao_ble_sense_devkitv2-adafruit.conf;prj_wearable.conf;prj_wearable_phase3_sd.conf" \
#     -DDTC_OVERLAY_FILE="overlay/xiao_ble_sense_devkitv2-adafruit.overlay;overlay/wearable-peripherals.overlay"

# --- Attached BFFs ---
CONFIG_KELVINLEE_ENABLE_BUTTON=y
CONFIG_KELVINLEE_ENABLE_HAPTIC=y
CONFIG_KELVINLEE_ENABLE_OFFLINE_STORAGE=y

# --- MicroSD BFF support ---
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096

# --- Still absent on this bench stack ---
CONFIG_KELVINLEE_ENABLE_BATTERY=n

# USB power-supply check OFF: init_usb() can block after the boot LED sequence
# on this bench path. The app-facing BLE/audio path does not require it.
CONFIG_KELVINLEE_ENABLE_USB=n
