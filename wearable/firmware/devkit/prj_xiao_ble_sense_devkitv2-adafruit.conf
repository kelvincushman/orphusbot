# CONFIG_NFC_NDEF_URI_MSG=y
# CONFIG_NFC_NDEF_URI_REC=y
# CONFIG_HWINFO=y

#
#EVERYTHING ELSE
#

CONFIG_RING_BUFFER=y

CONFIG_PM_DEVICE=y
# CONFIG_NRFX_USBD=y

# CONFIG_FLASH=y

#
# KelvinLee features configuration
#

CONFIG_KELVINLEE_CODEC_OPUS=y
CONFIG_KELVINLEE_ENABLE_OFFLINE_STORAGE=y
CONFIG_KELVINLEE_ENABLE_ACCELEROMETER=n
CONFIG_KELVINLEE_ENABLE_BUTTON=y
CONFIG_KELVINLEE_ENABLE_BATTERY=y
CONFIG_KELVINLEE_ENABLE_USB=y
CONFIG_KELVINLEE_ENABLE_HAPTIC=y
